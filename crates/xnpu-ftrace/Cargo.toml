[package]
name = "xnpu-ftrace"
version.workspace = true
edition.workspace = true
license.workspace = true

# M5c FLM per-op trace (方案 A: Rust LD_PRELOAD, user-approved 2026-09-23).
# FLM's closed-source kernel DLLs (lib*_npu.so) call the C++ xrt API in
# libxrt_coreutil.so.2 via the PLT — intercept the mangled symbols with
# dlsym(RTLD_NEXT) passthrough + timestamped logging (the M1 xdump
# technique, one level up at the API instead of raw ioctl).

[lib]
name = "xnpu_ftrace"
crate-type = ["cdylib"]

[dependencies]
libc.workspace = true
